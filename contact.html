<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <style>
      /* Header */
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      #container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        width: 100%;
        min-height: 400px;
        padding-top: 3em;
        background: no-repeat lightgrey url(images/cliff_ocean.jpg);
        background-size: 1500px;
      }

      .main-header {
        background-color: rgba(255, 255, 255, 0.8);
        width: 700px;
        margin: 2em auto 0 auto;
        min-height: 100px;
        height: 100px;
      }

      .main-header .logo img {
        width: 100px;
        height: 100px;
        float: left;
        margin-right: 1em;
      }

      .main-header h1 {
        margin: 0;
        padding-top: 1.2em;
        color: #333;
      }

      /* Navigation */
      nav {
        background-color: #666;
        text-align: center;
        padding: 0.75em 0;
      }

      .main-menu ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        justify-content: center;
        gap: 1rem;
      }

      .main-menu ul li {
        display: inline-block;
        text-transform: uppercase;
      }

      .main-menu ul li a {
        padding: 0.75em 1em;
        text-decoration: none;
        color: #fff;
        display: inline-block;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .main-menu ul li a:hover {
        color: #000;
        background-color: #ddd;
      }

      .main-menu ul li.active {
        background-color: #9ed034;
      }

      .main-menu ul li.active a {
        color: white;
        background-color: #9ed034;
      }

      /* Main */
      main {
        padding: 2rem 1.25rem;
        font-family: Arial, Helvetica, sans-serif;
      }

      main h1 {
        color: #9ed034;
        font-family: Arial, Helvetica, sans-serif;
      }

      main h2 {
        color: #333;
        margin-top: 20px;
      }

      form {
        max-width: 500px;
        margin: 20px 0;
      }

      fieldset {
        border: 1px solid #ccc;
        padding: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
      }

      input[type="text"],
      input[type="email"],
      select,
      textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }

      input[type="submit"] {
        background-color: #9ed034;
        color: white;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
      }

      input[type="submit"]:hover {
        background-color: #7fb01c;
      }

      /* Partners */
      .partners {
        padding: 20px;
        text-align: center;
      }

      .partners img {
        margin: 10px;
        max-height: 100px;
      }

      /* Footer */
      footer {
        background-color: black;
        text-align: center;
        padding: 1.25rem 0;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <header>
        <div class="main-header">
          <div class="logo">
            <img src="images/logo.png" alt="Great Cliffs Logo" />
          </div>
          <h1>Great Cliffs</h1>
        </div>
      </header>

      <nav>
        <div class="main-menu">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="activities.html">Activities</a></li>
            <li class="active"><a href="contact.html">Contact</a></li>
          </ul>
        </div>
      </nav>

      <main>
        <h1>Contacting Us</h1>
        <p>If you need more information, please contact us below.</p>
        <h2>Phone:</h2>
        <p>(800)GCLIFFS</p>
        <h2>Email:</h2>
        <p>info@greatcliffs.com</p>

        <form action="/contact" method="post">
          <fieldset>
            <label for="full-name">Enter your full name</label><br />
            <input type="text" id="full-name" name="full-name" /><br /><br />

            <label for="email">Enter your email</label><br />
            <input type="email" id="email" name="email" /><br /><br />

            <label for="phone">Enter your phone</label><br />
            <input type="text" id="phone" name="phone" /><br /><br />

            <label>Preferred contact method</label><br />
            <input type="radio" id="contact-email" name="contact-method" value="Email" />
            <label for="contact-email">Email</label>
            <input type="radio" id="contact-phone" name="contact-method" value="Phone" />
            <label for="contact-phone">Phone</label><br /><br />

            <label for="cliff">Select a cliff</label><br />
            <select id="cliff" name="cliff">
              <option>West</option>
              <option>North</option>
              <option>East</option>
              <option>South</option>
            </select><br /><br />

            <label for="message">Tell us how you heard about us</label><br />
            <textarea id="message" name="message" rows="5" cols="30"></textarea><br /><br />

            <input type="submit" value="Submit" />
          </fieldset>
        </form>
      </main>

      <footer>
        <p>&copy; 2026 Great Cliffs. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
