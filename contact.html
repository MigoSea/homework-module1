<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Cliffs - Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="contact">
    <div id="container">
        <header>
            <div class="main-header">
                <div class="logo">
                    <img src="images/logo.png" alt="Great Cliffs logo">
                </div>
                <nav class="main-menu">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="index.html#cliffs">Cliffs</a></li>
                        <li><a href="activities.html">Activities</a></li>
                        <li class="active"><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="contact-main">
            <h1>Contacting Us</h1>
            <p><strong>Phone:</strong> (800)GCLIFFS</p>
            <p><strong>Email:</strong> info@greatcliffs.com</p>

            <form action="/contact" method="post">
                <fieldset>
                    <legend>Contact Form</legend>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">

                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone">

                    <label>How should we contact you?</label>
                    <div class="radio-group">
                        <label class="radio-option"><input type="radio" name="contact-preference" value="email">Email</label>
                        <label class="radio-option"><input type="radio" name="contact-preference" value="phone">Phone</label>
                    </div>

                    <label for="cliff">Which Cliff are you inquiring?</label>
                    <select id="cliff" name="cliff">
                        <option>West Cliff</option>
                        <option>North Cliff</option>
                        <option>East Cliff</option>
                        <option>South Cliff</option>
                    </select>

                    <label for="source">How did you hear about us</label>
                    <textarea id="source" name="source"></textarea>

                    <button type="submit">Inquire</button>
                </fieldset>
            </form>
        </main>

        <section class="partners">
            <h2>Partners</h2>
            <div class="partner-logos">
                <div class="partner-item"><img src="images/partners/partner1.png" alt="Partner 1"></div>
                <div class="partner-item"><img src="images/partners/partner2.png" alt="Partner 2"></div>
                <div class="partner-item"><img src="images/partners/partner3.png" alt="Partner 3"></div>
                <div class="partner-item"><img src="images/partners/partner4.png" alt="Partner 4"></div>
                <div class="partner-item"><img src="images/partners/partner1.svg" alt="Partner 5"></div>
                <div class="partner-item"><img src="images/partners/partner2.svg" alt="Partner 6"></div>
            </div>
        </section>

        <footer>
            <div class="footer-copy">
                <p>© Copyright 2020 :: GreatCliffs.com</p>
            </div>
            <div class="social-links" aria-label="Social links">
                <span class="social-icon">f</span>
                <span class="social-icon">in</span>
                <span class="social-icon">t</span>
            </div>
        </footer>
    </div>
</body>
</html>
