<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Cliffs - Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="contact">
    <div id="container">
        <header>
            <div class="main-header">
                <div class="logo">
                    <img src="images/logo.png" alt="Great Cliffs logo">
                </div>
                <nav class="main-menu">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="index.html#cliffs">Cliffs</a></li>
                        <li><a href="activities.html">Activities</a></li>
                        <li class="active"><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="contact-main">
            <h1>Contact Great Cliffs</h1>
            <p>Questions about planning your adventure? Reach out and we will help you get started.</p>

            <form action="/contact" method="post">
                <fieldset>
                    <legend>Contact information</legend>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">

                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone">

                    <label for="contact-method">Preferred contact method</label>
                    <select id="contact-method" name="contact-method">
                        <option>Email</option>
                        <option>Phone</option>
                    </select>

                    <label for="message">Message</label>
                    <textarea id="message" name="message"></textarea>

                    <button type="submit">Send</button>
                </fieldset>
            </form>
        </main>

        <section class="partners">
            <h2>Partners</h2>
            <div class="partner-logos">
                <div class="partner-item"><img src="images/partners/partner1.png" alt="Partner 1"></div>
                <div class="partner-item"><img src="images/partners/partner2.png" alt="Partner 2"></div>
                <div class="partner-item"><img src="images/partners/partner3.png" alt="Partner 3"></div>
                <div class="partner-item"><img src="images/partners/partner4.png" alt="Partner 4"></div>
            </div>
        </section>

        <footer>
            <p>Copyright © 2020 GreatCliffs.com</p>
        </footer>
    </div>
</body>
</html>
